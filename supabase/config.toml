# Supabase CLI config for VOQDO.
# Remote project: knmgvpoyzzysakpmwjbm (link with `supabase link --project-ref knmgvpoyzzysakpmwjbm`).
# `supabase config push` applies the [auth] section below to the remote project.
project_id = "voqdo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "voqdo://"
additional_redirect_urls = ["voqdo://**", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Silent guest accounts: everyone starts anonymous, then may add an email.
enable_anonymous_sign_ins = true
enable_manual_linking = false
minimum_password_length = 8

[auth.rate_limit]
# Per IP, per hour. Guards the free trial against scripted sign-ups.
anonymous_users = 30
token_verifications = 30
sign_in_sign_ups = 30

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Codes rather than links: the app verifies them in place, with no deep links.
[auth.email.template.magic_link]
subject = "Your VOQDO sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your email for VOQDO"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.confirmation]
subject = "Your VOQDO confirmation code"
content_path = "./supabase/templates/confirmation.html"

[functions.ai]
verify_jwt = true

[functions.billing]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Dodo cannot send a Supabase JWT; the handler verifies the webhook signature instead.
[functions.dodo-webhook]
verify_jwt = false
